name: Build YUGITO GC Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          set -eux
          wget -q --show-progress \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Download export templates
        run: |
          set -eux
          wget -q --show-progress \
            "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2" \
            -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/yugito-gc-debug.keystore" \
            -storepass android \
            -alias yugitogc \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=YUGITO GC, OU=Game Card, O=YUGITO, L=Paris, C=FR"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          export/android/debug_keystore = "${HOME}/yugito-gc-debug.keystore"
          export/android/debug_keystore_user = "yugitogc"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --editor --quit-after 3

      - name: Export APK
        run: |
          mkdir -p build/android
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . \
            --export-debug "Android YUGITO GC" \
            build/android/YUGITO_GC_Mobile.apk
          sha256sum build/android/YUGITO_GC_Mobile.apk | tee build/android/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YUGITO-GC-Mobile
          path: |
            build/android/YUGITO_GC_Mobile.apk
            build/android/SHA256.txt
