name: Build YUGITO V13 True Credential Manager

on:
  workflow_dispatch:
  push:
    branches:
      - v13-credential-manager

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Confirm V13 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f scripts/AuthManagerV13.gd
          test -f addons/YugitoCredentialBridge/export_plugin.gd
          test -f bridge/src/main/java/com/hakamah/yugitogc/auth/YugitoCredentialBridge.java
          grep -F 'TRUE CREDENTIAL MANAGER' scripts/AuthManagerV13.gd
          grep -F 'AuthManager="*res://scripts/AuthManagerV13.gd"' project.godot
          grep -F 'gradle_build/use_gradle_build=true' export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native Credential Manager bridge
        shell: bash
        run: |
          set -o pipefail
          gradle -p bridge clean assembleRelease --stacktrace 2>&1 | tee bridge-build.log
          AAR="$(find bridge/build/outputs/aar -type f -name '*release.aar' | head -1)"
          test -n "$AAR"
          test -s "$AAR"
          mkdir -p addons/YugitoCredentialBridge/bin/release
          cp "$AAR" addons/YugitoCredentialBridge/bin/release/YugitoCredentialBridge-release.aar
          unzip -p "$AAR" classes.jar > /tmp/bridge-classes.jar
          jar tf /tmp/bridge-classes.jar | grep -F 'com/hakamah/yugitogc/auth/YugitoCredentialBridge.class'
          sha256sum "$AAR" | tee bridge-sha256.txt

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 5 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo cp /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Cache Godot export templates
        id: godot-templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-export-templates-v1

      - name: Download Godot export templates
        if: steps.godot-templates-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 5 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          java -version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Create debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -v \
            -keystore "$HOME/yugito-gc-v13-debug.keystore" \
            -storepass android \
            -alias yugitogc \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=YUGITO GC V13 Diagnostic, OU=Game Card, O=YUGITO, L=Paris, C=FR"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/yugito-gc-v13-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=yugitogc" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          timeout 240 godot --headless --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          echo '---- V13 relevant import diagnostics ----'
          grep -Ein 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to create an autoload|AuthManagerV13|YugitoCredentialBridge' /tmp/godot-import.log || true
          if grep -Eiq 'SCRIPT ERROR|Parse Error:.*(AuthManagerV13|res://scripts/)|Failed to load script.*AuthManagerV13|Failed to create an autoload.*AuthManager' /tmp/godot-import.log; then
            echo 'FATAL: V13 GDScript/import error.'
            exit 1
          fi

      - name: Install Godot Android Gradle build template
        shell: bash
        run: |
          set -o pipefail
          rm -rf android
          godot --headless --path . --install-android-build-template 2>&1 | tee /tmp/android-template.log
          test -d android
          find android -maxdepth 2 -type f | head -50

      - name: Export V13 debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          APK="build/android/YUGITO_GC_V13_TRUE_CREDENTIAL_MANAGER_DEBUG.apk"
          godot --headless --path . --export-debug "Android YUGITO GC" "$APK" 2>&1 | tee /tmp/godot-export.log
          test -s "$APK"
          sha256sum "$APK" | tee build/android/SHA256.txt

      - name: Verify Credential Manager is really inside APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="build/android/YUGITO_GC_V13_TRUE_CREDENTIAL_MANAGER_DEBUG.apk"
          rm -rf /tmp/v13apk
          mkdir /tmp/v13apk
          unzip -q "$APK" -d /tmp/v13apk
          grep -aR -m1 'YugitoCredentialBridge' /tmp/v13apk/classes*.dex
          grep -aR -m1 'androidx/credentials/CredentialManager' /tmp/v13apk/classes*.dex
          grep -aR -m1 'GoogleIdTokenCredential' /tmp/v13apk/classes*.dex
          grep -aR -m1 'GetGoogleIdOption' /tmp/v13apk/classes*.dex
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build/android/apksigner-debug.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -60 | tee build/android/badging.txt
          echo 'NOTE: debug-signed diagnostic artifact; it must be release re-signed before production-identity OAuth testing.'

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/diagnostics
          cp -f bridge-build.log build/diagnostics/ 2>/dev/null || true
          cp -f bridge-sha256.txt build/diagnostics/ 2>/dev/null || true
          cp -f /tmp/godot-import.log build/diagnostics/ 2>/dev/null || true
          cp -f /tmp/android-template.log build/diagnostics/ 2>/dev/null || true
          cp -f /tmp/godot-export.log build/diagnostics/ 2>/dev/null || true

      - name: Upload V13 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUGITO_V13_TRUE_CREDENTIAL_MANAGER_DEBUG_FOR_RESIGN
          path: |
            build/android/YUGITO_GC_V13_TRUE_CREDENTIAL_MANAGER_DEBUG.apk
            build/android/SHA256.txt
            build/android/apksigner-debug.txt
            build/android/badging.txt
            build/diagnostics/
          if-no-files-found: warn
          retention-days: 7
