name: Temporary corrected Hiruzen draft atlas
on:
  push:
    paths:
      - '.github/workflows/temp-hiruzen-atlas.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected atlas
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("assets/ui/draft_catalog_mobile.png")
          img=Image.open(p).convert("RGBA")
          CARD_W,CARD_H=240,306
          H_GAP,V_GAP=8,10
          STEP_X,STEP_Y=CARD_W+H_GAP,CARD_H+V_GAP
          def box(i):
              return ((i%3)*STEP_X,(i//3)*STEP_Y,(i%3)*STEP_X+CARD_W,(i//3)*STEP_Y+CARD_H)
          tiles=[img.crop(box(i)) for i in range(70)]
          order=list(range(70))
          h=order.pop(33)
          order.insert(56,h)
          out=img.copy()
          for dst,src in enumerate(order):
              x=(dst%3)*STEP_X; y=(dst//3)*STEP_Y
              out.paste(tiles[src],(x,y))
          out.save("draft_catalog_mobile_HIRUZEN_4_5.png",optimize=True)
          print("size",out.size,"Hiruzen source=33 dest=56")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hiruzen-draft-atlas
          path: draft_catalog_mobile_HIRUZEN_4_5.png
          retention-days: 1
